# Nothing Phone (4a): Fedora's own GStreamer for V4L2 (Iris) hardware video decoding.
# Mecha's gstreamer package (/opt/gstreamer) provides the same library sonames, so
# nothing pulls in Fedora's core and base libraries by itself: name them here.
# Mecha's package stays installed and untouched.

[Match]
Profiles=frogger

[Content]
Packages=
    gstreamer1
    gstreamer1-plugins-base
    gstreamer1-plugins-good
    gstreamer1-plugins-bad-free
    # Browser with V4L2 decode (/etc/chromium/chromium.conf) and the YouTube
    # no-AV1 extension (/usr/share/frogger/no-av1)
    chromium
