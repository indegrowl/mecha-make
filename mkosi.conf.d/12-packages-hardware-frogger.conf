# Nothing Phone (4a) (Qualcomm Milos) hardware enablement

[Match]
Profiles=frogger

[Content]
Packages=
    # Kernel from frogger/build-kernel.sh (frogger/out/rpms)
    kernel-7.2.0-*.frogger
    # Marks good boots in the A/B slot attributes (frogger/build-qbootctl.sh)
    qbootctl
    # boot.img initramfs (mkosi.postinst.chroot)
    dracut
    # Fedora's ffmpeg-free rebuilt with the V4L2 H.264/HEVC decoders and the
    # v4l2m2m fixes (frogger/build-ffmpeg.sh). Only a .frogger build: a newer
    # Fedora ffmpeg-free must never replace it silently.
    ffmpeg-free-*.frogger*
    # Iris video codec checks (frogger/verify-video.sh)
    v4l-utils
    # Remoteproc file service (Wi-Fi/WPSS) and QRTR tools
    tqftpserv
    qrtr
    # Modem: remote EFS for MPSS (udev starts it once /dev/qcom_rmtfs_mem1
    # appears) and the cellular stack
    rmtfs
    ModemManager
    # Built from mechanix-keyboard main (frogger/build-keyboard.sh) until the
    # Mecha repo ships a build with the audio feedback work
    mechanix-keyboard-*.frogger*
    # Steam Remote Play: hides the green seam the client samples from the Iris
    # decoder's padding (frogger/build-steam-padfix.sh)
    frogger-steam-padfix-*.frogger*
    # Steam app (Remote Play): gamescope session, controller udev rules, the
    # libraries Valve's ARM64 client loads, and the first-open installer's tools
    # Fedora's gamescope with SPI touchscreens mapped to the internal panel
    # (frogger/build-gamescope.sh). Only a .frogger build, like ffmpeg-free.
    gamescope-*.frogger*
    steam-devices
    gtk2
    ibus-libs
    libICE
    libSM
    SDL3
    SDL3_image
    SDL3_ttf
    bubblewrap
    openal-soft
    zenity
    xdotool
    nss
    cups-libs
    libXtst
    NetworkManager-libnm
    glibc-langpack-en
    xrandr
    xset
    libavif
    python3
    # SSH over USB
    dnsmasq
    # USB mode manager
    usb-signaller
    evtest
    kmscube
    mesa-demos
    upower
    usbutils
