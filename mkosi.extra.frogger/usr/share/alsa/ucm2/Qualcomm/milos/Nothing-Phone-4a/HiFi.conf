# Nothing Phone (4a): earpiece capsule + bottom speaker, two AW88271 amps on
# primary MI2S. The amp volume control's maximum is the kernel-enforced cap,
# so the amps sit at their maximum and PipeWire does software volume. The cap
# is raised only while DSP speaker protection runs (needs frogger-vi-holder).

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		# Amplifier V/I feedback for DSP speaker protection. Held open by
		# frogger-vi-holder during playback; not offered to applications.
		cset "name='MultiMedia2 Mixer PRI_MI2S_TX' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	# The amps' V/I feedback (MultiMedia2) is routed but not offered as an
	# input; frogger-vi-holder keeps it open while the speakers play.
	EnableSequence [
		cset "name='MultiMedia2 Mixer PRI_MI2S_TX' 1"
		cset "name='Amp 0x34 PCM Playback Volume' 1023"
		cset "name='Amp 0x35 PCM Playback Volume' 1023"
	]

	DisableSequence [
		cset "name='Amp 0x34 PCM Playback Volume' 0"
		cset "name='Amp 0x35 PCM Playback Volume' 0"
		cset "name='MultiMedia2 Mixer PRI_MI2S_TX' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}
