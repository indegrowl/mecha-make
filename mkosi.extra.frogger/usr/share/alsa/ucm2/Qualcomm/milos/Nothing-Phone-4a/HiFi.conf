# Nothing Phone (4a): earpiece capsule + bottom speaker, two AW88271 amps on
# primary MI2S. The amp volume control's maximum is the kernel-enforced cap,
# so the amps sit at their maximum and PipeWire does software volume.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Amp 0x34 PCM Playback Volume' 1023"
		cset "name='Amp 0x35 PCM Playback Volume' 1023"
	]

	DisableSequence [
		cset "name='Amp 0x34 PCM Playback Volume' 0"
		cset "name='Amp 0x35 PCM Playback Volume' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}
