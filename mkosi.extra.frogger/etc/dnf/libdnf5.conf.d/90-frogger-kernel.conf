# The kernel in boot_a and its modules here come from frogger/build-kernel.sh.
# A kernel from Fedora or the Mecha repo would replace those modules and leave
# the flashed kernel without them, so dnf never touches the kernel. Update both
# together with frogger/kernel-update.sh (rpm -Uvh) and a new boot.img (README.md).
# mechanix-compositor comes from frogger/build-compositor.sh: the Mecha repo's
# build adds the Comet's colour matrix on top of the 4a's display calibration.
# gamescope comes from frogger/build-gamescope.sh: Fedora's build leaves the SPI
# touchscreen unrotated.
[main]
excludepkgs=kernel,kernel-core,kernel-modules*,mechanix-compositor,gamescope
