# ffmpeg-free and its libraries here come from frogger/build-ffmpeg.sh (V4L2
# hardware decoders and fixes for the Iris VPU). Fedora's build has no
# H.264/HEVC decoder at all, so dnf never replaces them; update them together
# with rpm -Uvh from frogger/out/rpms.
[main]
excludepkgs=ffmpeg-free,ffmpeg-free-devel,libavcodec-free*,libavdevice-free*,libavfilter-free*,libavformat-free*,libavutil-free*,libswresample-free*,libswscale-free*,libpostproc-free*
