# Nothing Phone (4a) system-wide Chromium flags (sourced by chromium-browser.sh).
# - Wayland: the Mechanix session is not detected as Wayland by default.
# - Video decode on the Iris VPU through Chromium's V4L2 stateful decoder.
# - /usr/share/frogger/no-av1: tells YouTube there is no AV1 (no AV1 hardware
#   on this phone), so it sends VP9 or H.264, which decode in hardware.
CHROMIUM_FLAGS="--ozone-platform=wayland --enable-features=AcceleratedVideoDecoder,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL --disable-features=DisableLoadExtensionCommandLineSwitch --load-extension=/usr/share/frogger/no-av1"
