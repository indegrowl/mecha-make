# Minimal image for testing in QEMU on x86-64
# Selected via `mkosi --profile=qemu build`.

[Output]
Output=mechanix-os-qemu
ImageId=mechanix-os-qemu
RepartDirectories=mkosi.repart.efi

[Distribution]
Architecture=x86-64

[Content]
Bootable=yes
Bootloader=systemd-boot
Hostname=comet
FinalizeScripts=mkosi.finalize.efi

Packages=
    kernel

[Build]
ToolsTreePackages=qemu-ui-sdl

[Runtime]
TPM=no
Console=gui
QemuArgs=-display vnc=:0
CPUs=4
RAM=4G
