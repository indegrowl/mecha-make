# Selected via `mkosi --profile=comet build`. Builds Mechanix OS for real Mecha Comet hardware

[Distribution]
Architecture=arm64

[Output]
RepartDirectories=mkosi.repart.efi

[Content]
Devicetrees=freescale/imx8mp-mecha-comet.dtb
Bootable=yes
Bootloader=systemd-boot
Hostname=comet
ExtraTrees=mkosi.extra.mecha,mkosi.extra.comet
FinalizeScripts=mkosi.finalize.efi
