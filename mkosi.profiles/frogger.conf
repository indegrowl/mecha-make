# Selected via `./build.sh --profile=frogger`. Builds Mechanix OS for the Nothing Phone (4a) ("frogger").
# The phone's bootloader (ABL) boots an Android boot.img, so mkosi builds only the
# root filesystem here; frogger/make-images.sh turns it into boot.img + userdata.img.

[Output]
Output=mechanix-os-frogger
ImageId=mechanix-os-frogger
RepartDirectories=mkosi.repart.frogger
SplitArtifacts=partitions

[Distribution]
Architecture=arm64

[Content]
Bootable=no
Hostname=frogger
# mkosi.local/frogger-firmware is staged by frogger/stage-firmware.sh (gitignored).
ExtraTrees=mkosi.extra.mecha,mkosi.extra.frogger,mkosi.local/frogger-firmware
# kernel-7.2.0-*.frogger RPM built by frogger/build-kernel.sh (gitignored).
PackageDirectories=frogger/out/rpms
